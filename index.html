<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음 기록</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFF5F7">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column of soft rounded cards on a blush page; single light theme by choice */
  --bg:#FFF5F7; --card:#FFFFFF; --ink:#4A2B38; --sub:#946577; --line:#F7D3DF;
  --rose:#D9557F; --rose-soft:#FCE4EC; --lilac:#7468D6; --lilac-soft:#ECEAFD;
  --mint:#1F8F6C; --mint-soft:#DDF4EC; --butter:#FFF0CC; --butter-ink:#7D5310;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,.d{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:24px;line-height:1.3} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
.sub{color:var(--sub);font-size:13px}
button{font-family:var(--body);font-size:15px;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
textarea,input[type=text],input[type=date],input[type=time],input[type=search]{width:100%;font-family:var(--body);font-size:15px;color:var(--ink);background:#FFFBFC;border:1.5px dashed #EFA9C0;border-radius:14px;padding:10px 12px;line-height:1.6}
textarea{min-height:84px;resize:vertical}
.card{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 0 var(--line)}
.btn{font-family:var(--display);font-size:16px;background:var(--rose);color:#fff;border-radius:999px;padding:11px 20px;text-align:center}
.btn.mint{background:var(--mint)} .btn.lilac{background:var(--lilac)}
.btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--line)}
.btn.sm{font-size:14px;padding:7px 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px}
.back{font-family:var(--display);background:#fff;border-radius:999px;padding:6px 14px;color:var(--rose);box-shadow:0 2px 0 var(--line)}
.hero{display:flex;gap:12px;align-items:center}
.hero svg{flex:none}
.av{margin:9px 9px 2px;width:92px;height:92px;border-radius:50%;object-fit:cover;flex:none;border:4px solid #F9C9D6;background:#FDE9E6;transition:filter .4s;display:block}
.avw{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.avw .pill{font-size:12px;color:var(--sub)}
.av.l1{border-color:#F08FB0;box-shadow:0 0 0 6px #FCE4EC,0 0 0 9px #FFF0CC}
.av.l2{border-color:#F08FB0;box-shadow:0 0 0 5px #FCE4EC}
.av.l3{border-color:#CFCAF5}
.av.l4{filter:grayscale(.35) brightness(.98);border-color:#CFC8D8}
.av.l5{filter:grayscale(.65) brightness(.95);border-color:#BDB6C6}
.sig{display:flex;flex-direction:column;gap:6px;background:#4A2B38;border-radius:16px;padding:8px 7px;flex:none}
.sig i{display:block;width:17px;height:17px;border-radius:50%;background:#7A5F69}
.sig i.on.r{background:#FF6B6B;box-shadow:0 0 0 3px rgba(255,107,107,.35)}
.sig i.on.y{background:#FFD24D;box-shadow:0 0 0 3px rgba(255,210,77,.35)}
.sig i.on.g{background:#4CD08A;box-shadow:0 0 0 3px rgba(76,208,138,.35)}
.sigw{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;font-size:12px;color:var(--sub)}
.bubble svg{flex:none}
.bubble{display:flex;gap:10px;align-items:flex-end}
.bubble .say{background:#fff;border-radius:18px 18px 18px 4px;padding:10px 14px;box-shadow:0 2px 0 var(--line);font-size:14px}
.note{background:var(--butter);color:var(--butter-ink);border-radius:16px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bn{display:flex;gap:12px;align-items:center;border-radius:22px;padding:14px;text-align:left;width:100%}
.bn .ic{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.bn b{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.bn span{font-size:13px}
.bn.r{background:var(--rose-soft)} .bn.r span{color:#A63E63}
.bn.l{background:var(--lilac-soft);color:#3A3190} .bn.l span{color:#5348B5}
.bn.m{background:var(--mint-soft);color:#0B5A43} .bn.m span{color:#17775A}
.bn.b{background:var(--butter);color:var(--butter-ink)} .bn.b span{color:#8F6414}
.bn.s{background:#E3F1FB;color:#1F4F78} .bn.s span{color:#2F6A9C}
.way{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;font-size:14px}
.bn.z{background:#F3EEF0;color:#8B7780}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:#fff}
.pill.ok{background:var(--mint);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;font-family:var(--display);font-size:14px;box-shadow:0 2px 0 var(--line)}
.foot{text-align:center;color:var(--sub);font-size:13px;font-family:var(--display);letter-spacing:.3px;padding-top:6px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav button{width:38px;height:38px;border-radius:50%;background:#fff;font-size:20px;color:var(--rose);box-shadow:0 2px 0 var(--line)}
.datenav div{text-align:center}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.scale button{aspect-ratio:1;border-radius:50%;background:#fff;border:1.5px solid var(--line);font-size:13px;color:#A63E63;font-variant-numeric:tabular-nums}
.scale button.on{background:var(--rose);border-color:var(--rose);color:#fff;font-family:var(--display)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);gap:10px}
.ends span:last-child{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:#8A3E5B}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.chip.l{border-color:#CFCAF5;color:#4338A8} .chip.l.on{background:var(--lilac);border-color:var(--lilac);color:#fff}
.chip.m{border-color:#A9E2CF;color:#0B5A43}
details{font-size:13px;color:var(--sub)}
details summary{cursor:pointer;color:var(--rose)}
details ul{margin:6px 0 0;padding-left:18px}
.q{font-family:var(--display);font-size:16px}
.ai{background:var(--lilac-soft);color:#352C86;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;font-size:14px}
.ai .who{font-family:var(--display);font-size:13px;color:var(--lilac)}
.happy{background:var(--butter);color:var(--butter-ink);box-shadow:0 2px 0 #F3DDA4}
.happy textarea,.happy input{border-color:#E6C277;background:#FFFCF2}
.media{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.media figure{margin:0;position:relative;border-radius:14px;overflow:hidden;background:#fff;aspect-ratio:1}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.media figure button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(74,43,56,.75);color:#fff;font-size:14px}
.savebar{position:sticky;bottom:10px;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.94);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 2px 0 var(--line)}
.care{background:#fff;border:1.5px solid #EFA9C0;border-radius:18px;padding:12px 14px;font-size:14px}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.steps span{font-size:12px;border-radius:999px;padding:3px 10px;background:#fff;color:#A9A0A4;border:1.5px solid #E9E2E5}
.steps span.done{background:#BFEBDC;border-color:#BFEBDC;color:#0B5A43}
.steps span.now{background:var(--mint);border-color:var(--mint);color:#fff;font-family:var(--display)}
.ex{font-size:13px;color:#17775A;background:var(--mint-soft);border-radius:12px;padding:6px 12px}
.err{color:#B3261E;font-size:13px}
.ans{background:#F6FBF9;border-radius:14px;padding:8px 12px;font-size:14px}
.ans b{font-family:var(--display);font-weight:400;color:var(--mint);margin-right:6px}
.rec{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 2px 0 var(--line);font-size:14px;display:flex;flex-direction:column;gap:6px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--rose);vertical-align:middle;margin-right:5px}
.legend i.a{border-top:3px dashed var(--lilac)}
canvas{max-width:100%;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12px;text-align:center}
.cal span{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.cal span.w{background:var(--rose-soft);color:#A63E63}
.cal span.hi{background:var(--rose);color:#fff}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-size:14px;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#pdfroot{position:absolute;left:-10000px;top:0;width:760px;background:#fff;color:#33222A;font-family:var(--body);font-size:14px;line-height:1.6}
#pdfroot .pb{padding:10px 6px;background:#fff}
#pdfroot h1{font-size:26px} #pdfroot h2{font-size:17px;color:var(--rose)}
#pdfroot .pd{border:1.5px solid var(--line);border-radius:14px;padding:12px 16px}
#pdfroot .pk{color:#946577;font-size:12.5px;margin-top:6px}
#pdfroot img{max-width:220px;max-height:220px;border-radius:10px;margin:6px 6px 0 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="pdfroot" aria-hidden="true"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const toDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return ymd(d)};
const WD=['일','월','화','수','목','금','토'];
const fmtK=s=>{const d=toDate(s);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+WD[d.getDay()]+'요일'};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- content ---------- */
const Q3=['누군가의 위로와 공감','안전하다는 느낌','혼자만의 시간','상대방의 사과나 설명','휴식과 수면','상황을 통제할 수 있다는 느낌'];
const Q4EX=['따뜻한 물 마시기','10분 산책하기','믿을 만한 사람에게 연락하기','오늘은 중요한 결정을 미루기','충분히 쉬기'];
const EMO=[
['슬픔',['슬픈','서글픈','울적한','허전한','외로운','쓸쓸한','먹먹한','그리운','상실감이 드는','비참한']],
['불안',['불안한','초조한','조마조마한','걱정되는','두려운','무서운','긴장되는','막막한','안절부절못하는','겁나는']],
['분노',['화나는','짜증나는','억울한','분한','원망스러운','답답한','괘씸한','약오르는','서운한','미운']],
['수치와 죄책감',['부끄러운','창피한','수치스러운','죄책감 드는','미안한','후회되는','자책하는','초라한','위축되는','못난 것 같은']],
['지침과 무기력',['지친','피곤한','무기력한','공허한','멍한','귀찮은','의욕 없는','버거운','소진된','아무 느낌 없는']],
['혼란과 놀람',['혼란스러운','당황스러운','놀란','어리둥절한','얼떨떨한','복잡한','갈팡질팡하는','믿기지 않는','충격받은','어이없는']],
['상처와 질투',['상처받은','배신감 드는','버림받은 것 같은','무시당한 것 같은','소외된','질투나는','부러운','실망스러운','섭섭한','거절당한 것 같은']],
['기쁨',['기쁜','행복한','즐거운','신나는','설레는','뿌듯한','자랑스러운','통쾌한','유쾌한','벅찬']],
['평온',['편안한','평온한','차분한','안심되는','홀가분한','여유로운','느긋한','포근한','후련한','든든한']],
['사랑과 희망',['사랑스러운','고마운','다정한','애틋한','감동적인','희망찬','기대되는','용기 나는','자신 있는','살아있는 것 같은']]
];
const STEPS=[
{k:'behavior',t:'행동',q:'지금 내가 하고 있는(또는 하지 못하고 있는) 행동은 무엇인가요?',ex:'밤에 잠을 못 자고 있음',
 cues:['잠을 못 자고 있어요','자꾸 휴대폰을 확인해요','아무것도 못 하고 누워 있어요','사람을 피하고 있어요','평소보다 많이 먹거나 거의 못 먹어요','일에 집중을 못 해요']},
{k:'body',t:'신체 반응',q:'그때 내 몸은 어떻게 반응하고 있나요?',ex:'불면, 가슴 두근거림',
 cues:['가슴이 두근거려요','숨이 막히는 것 같아요','소화가 안 돼요','몸에 힘이 빠져요','머리가 아파요','어깨와 턱에 힘이 들어가요','눈물이 나요']},
{k:'emotion',t:'감정',q:'이 행동과 몸의 반응을 만든 감정은 무엇일까요?',ex:'불안함, 초조함',
 cues:['마음이 불편해요','답답하고 숨이 막히는 것 같아요','누군가가 밉고 원망스러워요','불안하고 무서워요','슬프고 눈물이 날 것 같아요','아무 감정도 느껴지지 않아요','잘 모르겠어요']},
{k:'thought',t:'생각',q:'내가 어떤 생각에 빠져 있길래 그 감정이 드는 걸까요?',ex:'내가 좋은 아빠가 될 수 있을까?',
 cues:['무언가 나쁜 일이 생길 것 같아요','버림받거나 외면당할까 봐 걱정돼요','이미 일어난 일을 계속 떠올리게 돼요','내가 부족해서 그런 것 같아요','이유는 설명하기 어렵지만 마음이 불편해요']},
{k:'event',t:'사건',q:'그 생각을 만들어낸 사건이나 상황은 무엇인가요?',ex:'아내가 임신함',
 cues:['누군가의 말이나 행동이 있었어요','연락이 늦거나 오지 않았어요','일이나 학교에서 무슨 일이 있었어요','예전 일이 갑자기 떠올랐어요','특별한 사건은 없었어요']},
{k:'plan',t:'대책',q:'그래서 내가 해볼 수 있는 가장 작은 대책은 무엇인가요?',ex:'내일 아침부터 좋은 아빠가 되는 법 검색하기',
 cues:['사실과 내 해석을 나눠서 적어 보기','믿을 만한 사람에게 이야기하기','오늘은 결정을 미루고 쉬기','내일 아침 10분만 알아보기','상담 시간에 이 기록 가져가기']}
];
const PERSONA=`너는 30년 넘게 임상에서 일해 온 심리상담 전문가이자 정신건강의학과 전문의처럼 생각하고 말하는 도우미다. 특히 트라우마와 오래된 상처 때문에 스스로 극복하기 어려워하는 사람을 돕는 데 능숙하고, 인지행동치료(CBT)에 밝다. 사용자는 상처에서 회복하는 중인 성인이다.
원칙:
1) 교과서 같은 원론적 조언("충분히 쉬세요", "긍정적으로 생각하세요" 등)은 금지. 반드시 사용자가 직접 쓴 표현과 상황을 짚어서 이 사람에게만 맞는 구체적인 말을 한다.
2) 아래에 [메모]와 [최근 기록]이 있으면 꼭 활용한다. 이 사람에게 반복되는 상황, 자주 드는 생각, 전에 도움이 됐던 행동을 반영해서, 시간이 지날수록 더 잘 맞는 제안을 한다. 반복되는 모습은 "~하는 편인 것 같아요"처럼 말한다.
3) 진단명이나 성격 유형을 붙이지 않는다. 숨은 원인을 단정하지 않는다. "~일 수도 있어요", "~인 것 같아요"처럼 사용자가 고칠 수 있는 임시 표현만 쓴다.
4) 답을 대신 정해 주지 않는다. 사용자가 스스로 떠올리도록 작은 단서를 준다. 상처가 깊은 사람은 자책으로 빠지기 쉬우니, 책임을 묻는 표현 대신 그때 그럴 수밖에 없었던 이유를 함께 본다.
5) 따뜻하고 짧은 해요체. 훈계, 과장된 위로, 이모지 금지.
6) 자해나 자살을 떠올리는 내용이 보이면 단서 대신, 지금 혼자 있지 말고 자살예방상담전화 109나 믿을 만한 사람에게 바로 연락하도록 부드럽게 권한다.
출력은 설명 없이 JSON 하나만.`;

const S={joy:null,view:'home',date:today(),docs:{},col:null,assets:null,downloads:null,sample:null,loaded:false,month:today().slice(0,7),cbt:null,emoQ:''};

let IDB=null,AIERR=0;const URLS={};
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('maum',1);r.onupgradeneeded=()=>{r.result.createObjectStore('docs');r.result.createObjectStore('media')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idb(store,mode,fn){return new Promise((res,rej)=>{const tx=IDB.transaction(store,mode),rq=fn(tx.objectStore(store));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=tx.onabort=()=>rej(tx.error)})}
async function persist(key){
  if(!IDB){toast('이 브라우저에서는 저장할 수 없어요. 크롬으로 열어 주세요.');return false}

}
async function removeDoc(key){delete S.docs[key];if(IDB){try{await idb('docs','readwrite',s=>s.delete(key))}catch(e){}}}
async function mediaUrl(id){if(URLS[id])return URLS[id];try{const b=await idb('media','readonly',s=>s.get(id));return b?(URLS[id]=URL.createObjectURL(b)):''}catch(e){return ''}}

const settings=()=>Object.assign({kind:'settings',name:'',credit:'',avatar:false,avatar2:false,rem:'00:00',remOff:false,key:'',model:'gemini-2.5-flash'},S.docs.settings||{});
const blankDay=date=>({kind:'day',date,dep:null,anx:null,q1:'',q2:'',q3:[],q3etc:'',q4:'',h1:'',h2:'',h3:'',media:[],emotions:[],emoNote:''});

const avgToday=()=>{const d=S.docs['day_'+today()];return isDone(d)?(d.dep+d.anx)/2:null};
const level=()=>{const a=avgToday();return a==null?0:a<=2?1:a<=4?2:a<6?3:a<8?4:5};

function queueSave(){setSt('쓰는 중…');clearTimeout(saveT);saveT=setTimeout(commit,1300)}
async function commit(){

/* ---------- AI ---------- */
async function gem(prompt){
  const st=settings();if(!st.key){AIERR='nokey';return null}
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(st.model||'gemini-2.5-flash')+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':st.key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0.7}})});
    if(!r.ok){AIERR=r.status;return null}
    const j=await r.json(),t=j.candidates[0].content.parts.map(p=>p.text||'').join('').replace(/^```(json)?\s*|```\s*$/g,'').trim();
    const v=JSON.parse(t);AIERR=0;return v&&typeof v==='object'?v:null;
  }catch(e){AIERR='net';return null}
}
const cut=(s,n)=>String(s||'').replace(/\s+/g,' ').slice(0,n);
function historyText(){
  const ds=Object.keys(S.docs).filter(k=>k.startsWith('day_')).sort().slice(-14).map(k=>S.docs[k]);
  const L=ds.map(d=>`${d.date} 우울 ${d.dep==null?'-':d.dep} 불안 ${d.anx==null?'-':d.anx}`+(d.q1?` | 상황: ${cut(d.q1,140)}`:'')+(d.q2?` | 반응: ${cut(d.q2,110)}`:'')+((d.q3||[]).length||d.q3etc?` | 필요했던 것: ${(d.q3||[]).concat(d.q3etc?[d.q3etc]:[]).join(', ')}`:'')+(d.q4?` | 작은 행동: ${cut(d.q4,90)}`:'')+((d.emotions||[]).length?` | 감정 이름표: ${d.emotions.join(', ')}`:'')+(d.h1?` | 행복했던 순간: ${cut(d.h1,90)}`:''));
  const cb=cbtList().filter(r=>r.done&&r.summary).slice(0,5).map(r=>`${r.date} ${cut(r.summary,220)}`);
  const pf=(S.docs.aiprofile||{}).text||'';
  return (pf?`[메모: 이 사용자에 대해 지금까지 정리된 내용. 사용자가 직접 보고 고칠 수 있음]\n${pf}\n\n`:'')+(L.length?`[최근 기록]\n${L.join('\n')}\n\n`:'')+(cb.length?`[최근 생각 따라가기 정리]\n${cb.join('\n')}\n\n`:'')+(ways().happy.length||ways().lift.length?`[사용자가 직접 적은 나만의 방법 (괄호는 해 본 횟수)]\n행복을 느끼는 방법: ${ways().happy.map(x=>`${cut(x.text,50)}(${x.n||0})`).join(', ')||'없음'}\n우울함에서 벗어나는 방법: ${ways().lift.map(x=>`${cut(x.text,50)}(${x.n||0})`).join(', ')||'없음'}\n\n`:'')+(joyList().length?`[사용자가 모아 둔 행복했던 순간, 우울함에서 벗어난 순간]\n${joyList().slice(0,8).map(j=>`${j.date} ${JT[j.type]}: ${cut(j.text,120)}`+(j.helped?` | 도움이 된 것: ${cut(j.helped,60)}`:'')).join('\n')}\n\n`:'');
}
async function askAI(task){const v=await gem(PERSONA+'\n\n'+historyText()+task);if(v)logAI(task,v);return v}
function logAI(task,v){
  const lg=clone(S.docs.ailog||{kind:'ailog',items:[],since:0});
  lg.items.push({t:Date.now(),ctx:cut(task,700),reply:cut(JSON.stringify(v),700),picked:[]});lg.items=lg.items.slice(-60);lg.since=(lg.since||0)+1;

}
function logPick(t){const lg=S.docs.ailog;if(!lg||!lg.items.length)return;lg.items[lg.items.length-1].picked.push(cut(t,120));persist('ailog')}
let pfBusy=false;
async function updateProfile(){
  if(pfBusy)return false;pfBusy=true;
  const lg=S.docs.ailog||{items:[]};
  const v=await gem(PERSONA+'\n\n'+historyText()+`[최근 도움 대화]\n${lg.items.slice(-12).map(i=>`- 상황: ${cut(i.ctx,320)}\n  도우미 답: ${cut(i.reply,280)}\n  사용자가 고른 것: ${i.picked.join(', ')||'(고르지 않음)'}`).join('\n')||'(없음)'}\n\n[할 일] 위 기록과 대화만을 근거로 [메모]를 새로 고쳐 쓴다. 기존 메모에서 여전히 맞는 내용은 남기고, 새로 드러난 것을 더하고, 틀린 것으로 보이는 것은 지운다. 아래 항목마다 한두 줄씩, 사용자가 실제로 쓴 표현을 살려서 쓴다. 근거가 부족한 항목은 "아직 잘 모름"이라고 쓴다. 진단명, 성격 유형, 추측한 과거사는 쓰지 않는다.\n항목: 1) 마음이 자주 힘들어지는 상황 2) 그때 자주 드는 생각 3) 몸과 행동의 반응 4) 그럴 때 자주 필요로 하는 것 5) 실제로 도움이 됐거나 스스로 고른 작은 행동 6) 행복을 느끼는 순간 7) 도와줄 때 잘 맞는 말투와 피해야 할 것(고른 단서와 고르지 않은 단서를 참고)\n형식: {"profile":"1) ...\\n2) ...\\n..."}`);

  return false;
}

function streak(){let d=today(),n=0;if(!isDone(S.docs['day_'+d]))d=addDays(d,-1);while(isDone(S.docs['day_'+d])){n++;d=addDays(d,-1)}return n}
function reminderTarget(){
  const st=settings();if(st.remOff||!S.loaded)return null;

  const t=st.rem||'00:00',now=new Date(),cur=pad(now.getHours())+':'+pad(now.getMinutes());
  if(+t.slice(0,2)<12){const y=addDays(today(),-1);return cur>=t&&now.getHours()<12&&!isDone(S.docs['day_'+y])?y:null}

/* graph */
function drawChart(cv,dates,w,h){
  const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,w,h);
  const L=30,R=12,T=12,B=26,pw=w-L-R,ph=h-T-B,n=dates.length;
  const X=i=>L+(n>1?pw*i/(n-1):pw/2),Y=v=>T+ph*(1-v/10);
  g.font='12px "Gowun Dodum",sans-serif';g.fillStyle='#946577';g.strokeStyle='#F7D3DF';g.lineWidth=1;g.textAlign='right';g.textBaseline='middle';
  for(let v=0;v<=10;v+=2){g.beginPath();g.moveTo(L,Y(v));g.lineTo(w-R,Y(v));g.stroke();g.fillText(v,L-8,Y(v))}
  g.setLineDash([3,4]);g.strokeStyle='#E8A0B8';g.beginPath();g.moveTo(L,Y(6));g.lineTo(w-R,Y(6));g.stroke();g.setLineDash([]);
  g.textAlign='center';g.textBaseline='top';const every=Math.max(1,Math.ceil(n/8));
  dates.forEach((d,i)=>{if(i%every===0||i===n-1&&i%every>every/2)g.fillText(n>31?d.slice(5).replace('-','/'):+d.slice(8),X(i),h-B+8)});
  [['dep','#D9557F',[]],['anx','#7468D6',[6,4]]].forEach(([k,col,dash])=>{
    const pts=dates.map((d,i)=>{const x=S.docs['day_'+d];return x&&x[k]!=null?[X(i),Y(x[k])]:null});
    g.strokeStyle=col;g.fillStyle=col;g.lineWidth=2.5;g.setLineDash(dash);g.beginPath();let pen=false;
    pts.forEach(p=>{if(!p){pen=false;return}if(pen)g.lineTo(p[0],p[1]);else g.moveTo(p[0],p[1]);pen=true});g.stroke();g.setLineDash([]);
    pts.forEach(p=>{if(p){g.beginPath();g.arc(p[0],p[1],3.2,0,7);g.fill()}});
  });
}

      let blob;try{blob=await buildPdf(f,t,true,st)}catch(e){st.textContent='사진을 넣지 못해 사진 없이 다시 만드는 중…';blob=await buildPdf(f,t,false,st)}
      saveFile(blob,`마음기록_${f}_${t}.pdf`);st.textContent='PDF를 다운로드 폴더에 저장했어요.';
    }catch(e){st.textContent='PDF를 만들지 못했어요. 기간을 줄여서 다시 시도해 주세요.'}
    btn.textContent='PDF 만들기';$('#pdfroot').innerHTML='';
  };
}
function saveFile(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
async function buildPdf(f,t,photos,st){
  const root=$('#pdfroot'),ds=[];for(let d=f;d<=t;d=addDays(d,1))ds.push(d);
  const days=ds.map(d=>S.docs['day_'+d]).filter(Boolean),cb=cbtList().filter(r=>r.date>=f&&r.date<=t).reverse();
  const kv=(k,v)=>v?`<div class="pk">${k}</div><div>${esc(v).replace(/\n/g,'<br>')}</div>`:'';
  root.innerHTML=`<div class="pb"><h1>마음 기록지</h1><p>${esc(settings().name||'')} · ${fmtK(f)} ~ ${fmtK(t)} · 기록한 날 ${days.filter(isDone).length}일</p></div>
  <div class="pb"><h2>우울감 · 불안감 변화</h2><p style="font-size:12.5px;color:#946577">분홍 실선은 우울감, 보라 점선은 불안감, 가는 점선은 6점</p><canvas id="pcv"></canvas></div>
  ${days.map(d=>`<div class="pb"><div class="pd"><h2>${fmtK(d.date)}</h2><p>주관적 우울감 <b>${d.dep==null?'–':d.dep}</b> / 10 · 주관적 불안감 <b>${d.anx==null?'–':d.anx}</b> / 10</p>
   ${kv('Q1. 마음을 가장 힘들게 만든 상황이나 사건',d.q1)}${kv('Q2. 그 상황에서 나의 반응',d.q2)}${kv('Q3. 그 순간 가장 필요했던 것',(d.q3||[]).concat(d.q3etc?[d.q3etc]:[]).join(', '))}${kv('Q4. 나를 위한 가장 작은 행동',d.q4)}
   ${kv('감정 이름표',(d.emotions||[]).join(', '))}${kv('감정 메모',d.emoNote)}
   ${kv('행복했던 순간',d.h1)}${kv('그때의 기분',d.h2)}${kv('기억하고 싶은 이유',d.h3)}
   ${(d.media||[]).length?`<div>${d.media.map(m=>String(m.ct||'').startsWith('video')?'<span class="pk">동영상 첨부 있음 </span>':photos?`<img data-mid="${esc(m.id)}">`:'<span class="pk">사진 첨부 있음 </span>').join('')}</div>`:''}</div></div>`).join('')}
  ${joyList().filter(j=>j.date>=f&&j.date<=t).reverse().map(j=>`<div class="pb"><div class="pd"><h2>행복 모음 · ${fmtK(j.date)}</h2>${kv(JT[j.type]||JT.happy,j.text)}${kv('그때 기분',j.feel)}${kv('도움이 된 것',j.helped)}${(j.media||[]).length?`<div>${j.media.map(m=>String(m.ct||'').startsWith('video')?'<span class="pk">동영상 첨부 있음 </span>':photos?`<img data-mid="${esc(m.id)}">`:'<span class="pk">사진 첨부 있음 </span>').join('')}</div>`:''}</div></div>`).join('')}
  ${cb.map(r=>`<div class="pb"><div class="pd"><h2>생각 따라가기 · ${fmtK(r.date)}</h2>${STEPS.map(s=>kv(s.t,r.steps[s.k])).join('')}${kv('나의 마음 정리',r.summary)}</div></div>`).join('')}
  ${settings().credit?`<div class="pb"><p style="text-align:center;color:#946577">${esc(settings().credit)}</p></div>`:''}`;
  drawChart($('#pcv'),ds,740,240);
  await fillMedia(root);
  await Promise.all($$('img',root).map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;setTimeout(r,8000)})));
  $$('img',root).forEach(im=>{if(!im.naturalWidth)im.remove()});
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'pt',format:'a4'}),PW=595.28,PH=841.89,M=36,cw=PW-2*M,maxH=PH-2*M;let y=M;
  const blocks=$$('.pb',root);
  for(let i=0;i<blocks.length;i++){
    st.textContent=`만드는 중… ${i+1} / ${blocks.length}`;
    const c=await html2canvas(blocks[i],{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
    const hpt=c.height*cw/c.width;
    if(hpt<=maxH){if(y+hpt>PH-M){pdf.addPage();y=M}pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',M,y,cw,hpt);y+=hpt+6}
    else{const pxp=Math.floor(maxH*c.width/cw);for(let off=0;off<c.height;off+=pxp){if(y>M){pdf.addPage();y=M}const hh=Math.min(pxp,c.height-off),tc=document.createElement('canvas');tc.width=c.width;tc.height=hh;const g=tc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,tc.width,hh);g.drawImage(c,0,off,c.width,hh,0,0,c.width,hh);pdf.addImage(tc.toDataURL('image/jpeg',.92),'JPEG',M,y,cw,hh*cw/c.width);y=M+hh*cw/c.width+6}}
  }
  return pdf.output('blob');
}
/* settings */
function vSettings(){
  const st=settings(),np=('Notification' in window)?Notification.permission:'none';
  return `${topBar('설정')}
  <section class="card"><label class="q" for="sname">홈 화면에서 부를 이름</label><input type="text" id="sname" value="${esc(st.name||'')}" placeholder="이름">
  <p class="q">홈 화면에 넣을 내 사진</p>
  ${[['avatar','기본 사진 (기록 전)'],['av1','평균 0~2점 · 활짝 웃는 표정'],['av2','평균 2.5~4점 · 편안한 미소'],['av3','평균 4.5~5.5점 · 담담한 표정'],['av4','평균 6~7.5점 · 힘든 표정'],['av5','평균 8~10점 · 많이 힘든 표정']].map(([k,l])=>`<div class="row"><span class="grow">${l}</span><span class="pill" style="background:${st[k]?'var(--mint-soft)':'#F3EEF0'}">${st[k]?'있음':'없음'}</span><button class="btn ghost sm" data-avpick="${k}" type="button">${st[k]?'바꾸기':'고르기'}</button>${st[k]?`<button class="btn ghost sm" data-avdel="${k}" type="button">빼기</button>`:''}</div>`).join('')}
  <input type="file" id="avfile" accept="image/*" hidden><p class="sub" id="avst">오늘 우울감과 불안감 점수의 평균에 따라 홈 화면 오른쪽 위 사진이 바뀌어요. 표정이 다른 내 사진을 구간마다 넣어 주세요. 비어 있는 구간은 가까운 구간의 사진(웃는 쪽은 웃는 쪽끼리, 힘든 쪽은 힘든 쪽끼리)이나 기본 사진이 나와요. 6점 이상 구간은 사진 색이 차분해지고, 4점 이하 구간은 테두리가 반짝여요.</p>
  <label class="q" for="scredit">홈 화면 아래 문구</label><input type="text" id="scredit" value="${esc(st.credit||'')}" placeholder="Crafted by. ...">
  <p class="sub">이름, 사진, 문구는 이 휴대폰에만 저장되고 인터넷에 올라가지 않아요.</p>
  <label class="q" for="srem">미작성 알림 시각</label><input type="time" id="srem" value="${esc(st.rem||'00:00')}">
  <p class="sub">이 시각이 지났는데 그날 기록이 없으면 홈 화면에 알림 배너가 떠요. 정오 이전 시각(예: 밤 12시)으로 두면 전날 기록을 확인해요.</p>
  <label class="row"><input type="checkbox" id="soff" ${st.remOff?'checked':''}> 알림 끄기</label>
  <div class="row"><button class="btn ghost sm" id="snoti" type="button">휴대폰 알림 허용하기</button><span class="sub" id="snst">${np==='granted'?'허용됨':np==='denied'?'차단됨 (휴대폰 설정에서 풀 수 있어요)':np==='none'?'이 브라우저는 지원하지 않아요':'아직 허용 전'}</span></div>
  <p class="sub">휴대폰 알림은 앱이 켜져 있거나 최근 앱 목록에 남아 있을 때만 울려요. 앱을 완전히 닫으면 울리지 않아요.</p></section>
  <section class="card"><h3>AI 도우미 (도와줘! 버튼)</h3>
  <label class="q" for="skey">Gemini API 키</label><input type="text" id="skey" value="${esc(st.key||'')}" placeholder="API 키 붙여넣기" autocomplete="off">
  <label class="q" for="smodel">모델 이름</label><input type="text" id="smodel" value="${esc(st.model||'')}" placeholder="gemini-2.5-flash">
  <p class="sub">키는 이 휴대폰에만 저장돼요. 도와줘!를 누를 때 내가 쓴 글, 최근 2주 기록, 아래 메모가 Google Gemini로 전송돼요.</p></section>
  <button class="btn" id="ssave" type="button">설정 저장하기</button>
  <section class="card"><h3>AI가 기억하는 나</h3>
  <p class="sub">도와줘!에서 나눈 대화 ${((S.docs.ailog||{}).items||[]).length}개가 이 휴대폰에 저장돼 있어요. 대화가 3번 쌓일 때마다 AI가 아래 메모를 새로 정리하고, 다음부터 이 메모에 맞춰 도와줘요.${(S.docs.aiprofile||{}).updatedAt?' 마지막 정리: '+fmtK(ymd(new Date(S.docs.aiprofile.updatedAt)))+'.':''}</p>
  <textarea id="pftext" style="min-height:220px" placeholder="아직 정리된 내용이 없어요. 도와줘!를 몇 번 쓰면 여기에 채워져요." aria-label="AI가 기억하는 나">${esc((S.docs.aiprofile||{}).text||'')}</textarea>
  <p class="sub">틀린 내용은 직접 고치거나 지울 수 있어요. AI는 고친 내용을 그대로 따라요.</p>
  <div class="row"><button class="btn lilac sm" id="pfsave" type="button">메모 저장</button><button class="btn ghost sm" id="pfnow" type="button">지금 다시 정리하기</button><button class="btn ghost sm" id="pfdel" type="button">기억 모두 지우기</button></div></section>
  <section class="card"><h3>기록 보관과 백업</h3><p class="sub">기록과 사진은 이 휴대폰 안에만 저장돼요. 코드를 고쳐도 기록은 그대로 남지만, 크롬의 사이트 데이터를 지우거나 휴대폰을 바꾸면 사라져요. 가끔 백업 파일을 받아 두세요. 백업에는 글과 점수만 들어가고 사진·동영상은 들어가지 않아요.</p>
  <div class="row"><button class="btn ghost sm" id="bexp" type="button">백업 파일 저장</button><input type="file" id="bfile" accept="application/json,.json" hidden><button class="btn ghost sm" id="bimp" type="button">백업 파일 불러오기</button></div></section>
  `;
}
function bSettings(){
  let avKey='avatar';
  $$('[data-avpick]').forEach(b=>b.onclick=()=>{avKey=b.dataset.avpick;$('#avfile').click()});
  $('#avfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    try{await idb('media','readwrite',s=>s.put(f,avKey));if(URLS[avKey]){URL.revokeObjectURL(URLS[avKey]);delete URLS[avKey]}S.docs.settings=Object.assign(settings(),{[avKey]:true});await persist('settings');toast('사진을 넣었어요.');render()}
    catch(err){toast('사진을 넣지 못했어요.')}};
  $$('[data-avdel]').forEach(b=>b.onclick=async()=>{const k=b.dataset.avdel;try{await idb('media','readwrite',s=>s.delete(k))}catch(e){}delete URLS[k];S.docs.settings=Object.assign(settings(),{[k]:false});await persist('settings');render()});
  $('#ssave').onclick=async()=>{S.docs.settings=Object.assign(settings(),{name:$('#sname').value.trim(),credit:$('#scredit').value.trim(),rem:$('#srem').value||'00:00',remOff:$('#soff').checked,key:$('#skey').value.trim(),model:$('#smodel').value.trim()||'gemini-2.5-flash'});const ok=await persist('settings');if(ok)toast('설정을 저장했어요.')};
  $('#snoti').onclick=async()=>{if(!('Notification' in window)){toast('이 브라우저는 알림을 지원하지 않아요.');return}const p=await Notification.requestPermission();$('#snst').textContent=p==='granted'?'허용됨':'허용되지 않았어요'};
  $('#pfsave').onclick=async()=>{S.docs.aiprofile={kind:'aiprofile',text:$('#pftext').value.trim(),updatedAt:Date.now()};if(await persist('aiprofile'))toast('메모를 저장했어요.')};
  $('#pfnow').onclick=async()=>{const b=$('#pfnow');b.textContent='정리하는 중…';const ok=await updateProfile();if(S.view!=='settings')return;if(ok)render();else{b.textContent='지금 다시 정리하기';toast(AIERR==='nokey'?'먼저 API 키를 넣고 설정을 저장해 주세요.':'정리하지 못했어요 ('+AIERR+'). 키와 모델 이름을 확인해 주세요.')}};
  $('#pfdel').onclick=async()=>{const b=$('#pfdel');if(!b.dataset.sure){b.dataset.sure=1;b.textContent='정말 지울까요? 한 번 더 누르기';return}await removeDoc('aiprofile');await removeDoc('ailog');toast('AI의 기억을 지웠어요.');render()};
  $('#bexp').onclick=()=>{const d=clone(S.docs);if(d.settings)delete d.settings.key;saveFile(new Blob([JSON.stringify(d)],{type:'application/json'}),'마음기록_백업_'+today()+'.json');toast('백업 파일을 저장했어요.')};
  $('#bimp').onclick=()=>$('#bfile').click();
  $('#bfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    try{const d=JSON.parse(await f.text());let n=0;for(const k of Object.keys(d)){if(!/^(day_|cbt_|joy_|ways$|settings$|aiprofile$|ailog$)/.test(k))continue;if(k==='settings')d[k].key=settings().key;if(k.startsWith('day_')||k.startsWith('joy_'))d[k].media=(S.docs[k]&&S.docs[k].media)||[];S.docs[k]=d[k];await persist(k);n++}toast('기록 '+n+'개를 불러왔어요.')}
    catch(err){toast('백업 파일을 읽지 못했어요. 이 앱에서 저장한 파일인지 확인해 주세요.')}};
}
const VIEWS={home:vHome,ways:vWays,joy:vJoy,record:vRecord,emotions:vEmotions,cbt:vCbt,graph:vGraph,pdf:vPdf,settings:vSettings};
const BIND={record:bRecord,ways:bWays,joy:bJoy,emotions:bEmotions,cbt:bCbt,graph:bGraph,pdf:bPdf,settings:bSettings};
function render(){$('#app').innerHTML=VIEWS[S.view]();if(BIND[S.view])BIND[S.view]();if(S.view==='home'&&IDB)fillMedia($('.hero'));window.scrollTo(0,0)}
function go(v,date){
  if(!S.loaded){toast('기록을 불러오는 중이에요. 잠시만요.');return}
  flushSave();if(v==='home'){S.cbt=null;S.joy=null}if(date)S.date=date;S.view=v;render();
}
$('#app').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const o=e.target.closest('[data-open]');if(o){go(o.dataset.open,today());return}
  if(e.target.closest('#remgo')){go('record',reminderTarget()||today())}
});
let lastDay=today();
function notifyCheck(){
  const rt=reminderTarget();if(!rt||!('Notification' in window)||Notification.permission!=='granted'||!navigator.serviceWorker)return;
  let last='';try{last=localStorage.getItem('maum_notified')||''}catch(e){}
  if(last===rt)return;try{localStorage.setItem('maum_notified',rt)}catch(e){}
  navigator.serviceWorker.ready.then(r=>r.showNotification('마음 기록',{body:(rt===today()?'오늘':'어제')+' 마음 기록이 아직 없어요. 자기 전에 잠깐 적어 볼까요?',icon:'icon-192.png',badge:'icon-192.png',tag:'maum'})).catch(()=>{});
}
setInterval(()=>{notifyCheck();if(S.view==='home'&&!document.hidden)render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view==='home')render();if(document.hidden)flushSave()});
boot();
</script>
